---
layout: default
---
<!-- optional intro banner -->
{% if page.intro %}
<div class="container">
  <div class="wrap-page-header text-center py-5" style="background:#fdd93d;">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h2 class="page-header big mb-0">{{ page.intro }}</h2>
      </div>
    </div>
  </div>
</div>
{% endif %}
<!-- Post Featured Image -->
{% if page.image %}
<div class="text-center mx-auto mb-5">
  <img class="featured-image text-center mx-auto rounded" src="{{ site.baseurl }}/{{ page.image }}" alt="{{ page.title }}">
</div>
{% endif %}
<!-- End Featured Image -->

<div class="col-lg-8 mx-auto">

  {% unless page.hide_title %}
  <div class="mainheading">
    <h1 class="posttitle">{{ page.title }}</h1>
  </div>
  {% endunless %}

  <div class="article-post serif-font">
    {{content}}
  </div>

  {% if page.comments == true %}
  <div id="comments">             
      {% include disqus.html %} 
  </div>
  {% endif %}

</div>
